services:
  postgres:
    image: postgres:16-alpine
    container_name: mundoporix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mundoporix
      POSTGRES_PASSWORD: mundoporix_dev
      POSTGRES_DB: mundoporix
    ports:
      - '5433:5432'
    volumes:
      - mundoporix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mundoporix -d mundoporix']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mundoporix_pgdata:
